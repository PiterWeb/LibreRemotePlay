version: "3"

tasks:
  dev-front:
    dir: frontend
    deps: [install-front]
    cmds:
      - pnpm run dev
    desc: Run the frontend in development mode
  dev-back:
    env:
       LRP_DEV: true
    cmds:
      - go build -o ./build/dev/bin/ . 
      - ./build/dev/bin/LibreRemotePlay -network-visible
    desc: Run the backend in development mode 
  build:
    deps: [build-front]
    platforms: [linux]
    cmds:
      - for: 
          matrix: 
            ARCH: [amd64, arm64]
            W: [wayland, x11, libei]
        platforms: [linux]
        cmd: CGO_ENABLED=0 GOOS=linux GOOARCH={{.ITEM.ARCH}} go build -tags {{.ITEM.W}} -o ./build/bin/LibreRemotePlay-{{.ITEM.ARCH}}-{{.ITEM.W}} .
      - cmd: CGO_ENABLED=0 GOOS=windows GOOARCH=amd64 go build -tags win -o ./build/bin/LibreRemotePlay.exe .
        platforms: [linux]
      - for: # Windows not tested
          matrix: 
            ARCH: [amd64, arm64]
            W: [wayland, x11, libei]
        platforms: [windows/amd64]
        cmd: pwsh -Command { $env:CGO_ENABLED = "0"; $env:GOOS = "linux"; $env:GOOARCH = "{{.ITEM.ARCH}}"; go build -tags {{.ITEM.W}} -o ./build/bin/LibreRemotePlay-{{.ITEM.ARCH}}-{{.ITEM.W}} . }
      - cmd: go build -tags win -o ./build/bin/LibreRemotePlay.exe . # Windows not tested
        platforms: [windows/amd64]
    desc: Build the application for all platforms
  build-linux-flatpak:
    deps: [build-front]
    cmds:
      - flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo --install builddir packaging/flatpak/io.github.PiterWeb.LibreRemotePlay.yml
  build-wasm-front:
    dir: frontend/static/wasm
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build -o signal.wasm
    desc: Build the frontend wasm
    sources:
      - signal.wasm
  test:
    desc: Run E2E tests
    dir: frontend
    deps: [dev-all]
    cmds:
      - pnpm run test
  install-front:
    dir: frontend
    cmds:
      - pnpm install
    sources:
      - package.json
    status:
      - test -d node_modules
  build-front:
    deps: [install-front, build-wasm-front]
    dir: frontend
    cmds:
      - pnpm run build
    sources:
      - src/**/*.css
      - src/**/*.js
      - src/**/*.ts
      - src/**/*.svelte
      - src/**/*.json
      - vite.config.ts
      - svelte.config.js
      - tailwind.config.js
      - package.json
    desc: Build the frontend
