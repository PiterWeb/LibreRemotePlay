id: io.github.PiterWeb.LibreRemotePlay
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: LibreRemotePlay
finish-args:
  - --device=dri # OpenGL rendering support.
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=home
  - --filesystem=host
  - --device=usb
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

build-options:
  build-args:
    - --share=network
  env:
    - GOROOT=/app/sdk/golang
    - GOBIN=/app/go/bin
    - CGO_ENABLED=1
    - NODEROOT=/app/sdk/node

modules:
  # - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - name: golang
    buildsystem: simple
    build-commands:
      - mkdir -p $GOROOT
      - mv $(pwd)/* $GOROOT
    sources:
      - type: archive
        url: https://go.dev/dl/go1.27.4.linux-amd64.tar.gz
        sha256: 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
  - name: nodejs
    buildsystem: simple
    build-commands:
      - mkdir -p $NODEROOT
      - mv $(pwd)/* $NODEROOT
    sources:
      - type: archive
        url: https://nodejs.org/dist/v24.17.0/node-v24.17.0-linux-x64.tar.xz
        sha256: ab343a1b747c7cbf3630dfd7dbf818c5423fab2eb4f5ad1afc896f6bd121a917
  - name: pnpm
    buildsystem: simple
    build-commands:
      - PATH=$PATH:$NODEROOT/bin $NODEROOT/bin/npm install -g pnpm@latest-11
  - name: wails
    buildsystem: simple
    build-commands:
      - $GOROOT/bin/go install github.com/go-task/task/v3/cmd/task@latest
  - name: libreremoteplay
    buildsystem: simple
    build-commands:
      - PATH=$PATH:$GOROOT/bin:$NODEROOT/bin $GOBIN/task build
      - install -Dm00755 build/bin/LibreRemotePlay-amd64-wayland $FLATPAK_DEST/bin/LibreRemotePlay
      - install -Dm00644 packaging/$FLATPAK_ID.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -Dm00644 packaging/$FLATPAK_ID.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm00644 packaging/flatpak/$FLATPAK_ID.appdata.xml $FLATPAK_DEST/share/appdata/$FLATPAK_ID.appdata.xml
    sources:
      - type: dir
        path: ../../
