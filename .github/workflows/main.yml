name: Wails build

on:
  push:
    tags:
      - '*' # Ejecuta en cualquier nuevo tag
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.27.2' ]
        include:
          - name: LibreRemotePlay-linux-amd64
            platform: linux/amd64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Setup Task
        run: pnpm i -g @go-task/cli
      - name: Build binaries
        run: task build
      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          files:
            build/bin/*
